<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>S03-2 學生個人資料｜數位實中 美術課 AI 眼鏡 App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
html,body{margin:0;padding:0;background:#20201f;font-family:'Noto Sans TC','PingFang TC',sans-serif;}
#stage{display:flex;align-items:center;justify-content:center;min-height:100svh;}
#screen{transform-origin:center center;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);}
#menu{position:fixed;right:14px;bottom:14px;z-index:9;width:46px;height:46px;border-radius:23px;
 background:rgba(246,242,234,.9);color:#3b3a38;display:flex;align-items:center;justify-content:center;
 text-decoration:none;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.35);}

    body { margin: 0; font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; background: #f0ece4; }
    a { color: #3b3a38; } a:hover { color: #1c1b19; }
    input::placeholder { color: #6b6862; }
  
</style>
</head>
<body>
<div id="stage"><div id="screen" data-w="412" data-h="917">

<div style="width: 412px; height: 917px; box-sizing: border-box; background: #e3e0d8; padding: 64px 32px 48px; display: flex; flex-direction: column; align-items: center; gap: 36px;">
  
  <form style="width: 100%; display: flex; flex-direction: column; gap: 20px;">
    
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="f-seat" style="font-size: 20px; font-weight: 700; color: #1c1b19; padding-left: 8px; text-align: center">選擇你的座號</label>
      <input id="f-seat" type="text" inputmode="numeric" placeholder="例如：12" style="height: 60px; box-sizing: border-box; border-radius: 30px; border: 3px solid #989691; background: #ffffff; padding: 0 24px; font-size: 20px; color: #1c1b19; font-family: inherit; outline-color: #323130;">
    </div>
    
  </form>
  <a href="04-main.html" style="margin-top: 12px; width: 280px; height: 68px; border-radius: 34px; background: #3b3a38; color: #f6f2ea; box-shadow: 0 6px 0 #20201f; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 26px; letter-spacing: 3px; text-decoration: none;">下一步</a>
</div>

</div></div>
<a id="menu" href="index.html" aria-label="回畫面選單">☰</a>
<script>
(function(){
  var el=document.getElementById('screen');
  if(window.self!==window.top){var m=document.getElementById('menu');if(m)m.style.display='none';}
  function fit(){
    var w=+el.dataset.w,h=+el.dataset.h;
    var s=Math.min(window.innerWidth/w,window.innerHeight/h);
    if(window.innerWidth>640) s=Math.min(s*0.94,1);
    el.style.transform='scale('+s+')';
    el.style.marginLeft=((w*s-w)/2)+'px';
    el.style.marginTop=((h*s-h)/2)+'px';
    el.style.marginRight=((w*s-w)/2)+'px';
    el.style.marginBottom=((h*s-h)/2)+'px';
  }
  fit();window.addEventListener('resize',fit);
  var inp=document.getElementById('course-code');
  if(inp){
    document.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click',function(){ if(inp.value.length<8) inp.value+=b.dataset.k; });
    });
    var del=document.querySelector('[data-act="del"]');
    if(del) del.addEventListener('click',function(){ inp.value=inp.value.slice(0,-1); });
  }
})();
</script>
</body>
</html>

 background:rgba(246,242,234,.9);color:#3b3a38;display:flex;align-items:center;justify-content:center;

    </div>
    <div style="display: flex; gap: 12px;">
      <button type="button" aria-label="使用者頭像" style="width: 48px; height: 48px; border-radius: 24px; padding: 0; background: #c2beb8; border: 3px solid #ffffff; box-shadow: 0 0 0 2px #989691; color: #323130; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="4"></circle><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path></svg>

  <div style="height: 68px; box-sizing: border-box; border-radius: 34px; border: 3px solid #989691; background: #ffffff; display: flex; align-items: center; padding: 0 8px 0 24px; gap: 8px;">
    <input id="course-code" type="text" readonly="" value="" placeholder="請輸入或掃描代碼" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #1c1b19; text-align: left">
    <button type="button" aria-label="掃描 QR Code" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 16px; padding: 0; border: none; background: #3b3a38; color: #f6f2ea; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"></path><path d="M8 12h8"></path></svg>
    </button>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 4px 28px 0;">
    <button type="button" data-k="1" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">1</button><button type="button" data-k="2" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">2</button><button type="button" data-k="3" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">3</button><button type="button" data-k="4" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">4</button><button type="button" data-k="5" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">5</button><button type="button" data-k="6" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">6</button><button type="button" data-k="7" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">7</button><button type="button" data-k="8" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">8</button><button type="button" data-k="9" style="height: 76px; border-radius: 22px; background: #ffffff; border: 2px solid #989691; box-shadow: 0 5px 0 #c2beb8; font-family: inherit; font-size: 34px; font-weight: 700; color: #1c1b19; cursor: pointer;">9</button>
    <div></div>

    <button type="button" aria-label="刪除一個字" data-act="del" style="height: 76px; border-radius: 22px; background: #c2beb8; border: 2px solid #989691; box-shadow: 0 5px 0 #989691; color: #1c1b19; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg>
    </button>
  </div>

</div>

</div></div>
<a id="menu" href="index.html" aria-label="回畫面選單">☰</a>
<script>
(function(){
  var el=document.getElementById('screen');
  if(window.self!==window.top){var m=document.getElementById('menu');if(m)m.style.display='none';}
  function fit(){
    var w=+el.dataset.w,h=+el.dataset.h;
    var s=Math.min(window.innerWidth/w,window.innerHeight/h);
    if(window.innerWidth>640) s=Math.min(s*0.94,1);
    el.style.transform='scale('+s+')';
    el.style.marginLeft=((w*s-w)/2)+'px';
    el.style.marginTop=((h*s-h)/2)+'px';
    el.style.marginRight=((w*s-w)/2)+'px';
    el.style.marginBottom=((h*s-h)/2)+'px';
  }
  fit();window.addEventListener('resize',fit);
  var inp=document.getElementById('course-code');
  if(inp){
    document.querySelectorAll('[data-k]').forEach(function(b){
      b.addEventListener('click',function(){ if(inp.value.length<8) inp.value+=b.dataset.k; });
    });
    var del=document.querySelector('[data-act="del"]');
    if(del) del.addEventListener('click',function(){ inp.value=inp.value.slice(0,-1); });
  }
})();
</script>
